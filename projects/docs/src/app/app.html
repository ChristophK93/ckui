<a class="skip-link" href="#main" (click)="skipToContent($event)">Skip to content</a>
<header class="header">
  <span class="brand">ckui</span>
  <nav aria-label="Main">
    <ul class="nav-list">
      @for (link of links; track link.path) {
        <li>
          <a
            class="nav-link"
            [routerLink]="link.path"
            routerLinkActive="nav-link-active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            >{{ link.label }}</a
          >
        </li>
      }
      <li class="nav-group">
        <span class="nav-group-label" id="nav-components">Components</span>
        <ul class="nav-list" aria-labelledby="nav-components">
          @for (link of componentLinks; track link.path) {
            <li>
              <a
                class="nav-link"
                [routerLink]="link.path"
                routerLinkActive="nav-link-active"
                ariaCurrentWhenActive="page"
                >{{ link.label }}</a
              >
            </li>
          }
        </ul>
      </li>
    </ul>
  </nav>
  <docs-theme-switcher class="switcher" />
</header>
<main id="main" #main tabindex="-1">
  <router-outlet />
</main>
